name: AI Village Tick
on:
  schedule:
    - cron: '*/15 * * * *'  # 每15分钟自动运行一次
  workflow_dispatch:        # 允许你手动点击按钮运行
jobs:
  run-village:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run village tick
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py
