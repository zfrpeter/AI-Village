name: AI Village Tick
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  run-village:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 必须要有这个权限
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run test
        run: python main.py
      - name: Save changes back to repo
        run: |
          git config --global user.name "AI Village Bot"
          git config --global user.email "bot@ai-village.local"
          git add villagers.json history.log || true
          git commit -m "Day ${{ github.run_number }}: 世界更新" || true
          git push
